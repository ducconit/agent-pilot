<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="400" fill="url(#bgGradient)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="180" r="160" fill="#0284c7" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="950" cy="220" r="180" fill="#6366f1" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Futuristic Background Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="1280" y2="50"/>
    <line x1="0" y1="100" x2="1280" y2="100"/>
    <line x1="0" y1="150" x2="1280" y2="150"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="250" x2="1280" y2="250"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="0" y1="350" x2="1280" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="1200" y1="0" x2="1200" y2="400"/>
  </g>

  <!-- Left: Stylized Logo Icon (Position: X=120, Y=100) -->
  <g transform="translate(100, 100)">
    <!-- Logo Outer Box -->
    <rect width="200" height="200" rx="44" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    
    <!-- Target Rings -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>
    <circle cx="100" cy="100" r="45" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Logo Pointer -->
    <path d="M65 52 L140 104 L101 111 L90 148 Z" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="2" filter="url(#glowEffect)"/>
    <circle cx="100" cy="100" r="6" fill="#ffffff" filter="url(#glowEffect)"/>
    <circle cx="100" cy="100" r="3" fill="#06b6d4"/>
  </g>

  <!-- Center-Right: Branding & Titles -->
  <g transform="translate(340, 100)">
    <!-- Antigravity-First Badge -->
    <rect width="186" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="5" fill="#a855f7" filter="url(#glowEffect)"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1">ANTIGRAVITY-FIRST</text>

    <!-- Chrome MV3 Badge -->
    <rect x="198" width="136" height="28" rx="14" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="214" cy="14" r="5" fill="#38bdf8" filter="url(#glowEffect)"/>
    <text x="228" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">MANIFEST V3</text>

    <!-- Main Title -->
    <text x="0" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="2">
      AGENT <tspan fill="url(#cyanGrad)">PILOT</tspan>
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Universal AI Agent Browser Controller • Virtual Mouse • CDP DevTools • Inspector &amp; Capture
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: Virtual Mouse -->
      <g transform="translate(0, 0)">
        <rect width="144" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🖱️ Virtual Mouse</text>
      </g>
      <!-- Pill 2: DevTools CDP -->
      <g transform="translate(156, 0)">
        <rect width="148" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">⚡ CDP DevTools</text>
      </g>
      <!-- Pill 3: Element Inspector -->
      <g transform="translate(316, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">🎯 Element Inspector</text>
      </g>
      <!-- Pill 4: Screenshot Studio -->
      <g transform="translate(496, 0)">
        <rect width="158" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f472b6">📸 Screenshot Suite</text>
      </g>
      <!-- Pill 5: Eyedropper -->
      <g transform="translate(666, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">🎨 Eyedropper</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="396" width="1280" height="4" fill="url(#cyanGrad)"/>
</svg>
