name: Release Agent Pilot (Extension & CLI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.2-beta)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Platform CLI & Extension Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Syntax & Lint Checks
        run: npm run lint

      - name: Run Go Unit Tests
        run: npm run test:cli

      - name: Validate Version Alignment
        run: |
          REF_TAG="${{ github.ref_name }}"
          PKG_VER="v$(node -p "require('./package.json').version")"
          MAN_VER="v$(node -p "require('./extensions/manifest.json').version_name || require('./extensions/manifest.json').version")"
          echo "GitHub Tag       : $REF_TAG"
          echo "package.json     : $PKG_VER"
          echo "manifest.json    : $MAN_VER"
          if [[ "$REF_TAG" != "$PKG_VER" ]]; then
            echo "::warning::Git tag ($REF_TAG) does not match package.json version ($PKG_VER)"
          fi

      - name: Package Chrome Extension Archive
        run: npm run pack

      - name: Cross-Compile Standalone Go CLI Binaries
        run: |
          mkdir -p dist
          cd cli
          targets=(
            "linux/amd64/agent-pilot-linux-amd64"
            "linux/arm64/agent-pilot-linux-arm64"
            "darwin/amd64/agent-pilot-darwin-amd64"
            "darwin/arm64/agent-pilot-darwin-arm64"
            "windows/amd64/agent-pilot-windows-amd64.exe"
            "windows/arm64/agent-pilot-windows-arm64.exe"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch output <<< "$target"
            echo "→ Compiling $output for $goos/$goarch..."
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "../dist/$output" .
          done

      - name: Generate Unified SHA-256 Checksums
        run: |
          cd dist
          sha256sum agent-pilot-* > checksums.txt
          echo "Unified SHA-256 Checksums:"
          cat checksums.txt

      - name: Generate Release Body with User & Installation Guides
        id: release_body
        run: |
          VERSION="${{ github.ref_name }}"
          cat << 'BODY_EOF' > dist/release_body.md
          # 🚀 Agent Pilot $VERSION

          **Universal AI Agent Browser Controller • Antigravity-First**
          *Biên dịch đa nền tảng cho Chrome Extension & Standalone Golang CLI / MCP Server*

          ---

          ### 📦 Tài Nguyên Bản Phát Hành (Release Assets)

          | Tài Nguyên | Hệ Điều Hành / Kiến Trúc | Mô Tả |
          | :--- | :--- | :--- |
          | `agent-pilot-$VERSION.zip` | All Platforms (Chrome MV3) | Tiện ích mở rộng Google Chrome đóng gói hoàn chỉnh |
          | `agent-pilot-linux-amd64` | Linux x86_64 | Standalone Go CLI / MCP Server (Zero-dep) |
          | `agent-pilot-linux-arm64` | Linux ARM64 (aarch64) | Standalone Go CLI / MCP Server (Zero-dep) |
          | `agent-pilot-darwin-amd64` | macOS Intel | Standalone Go CLI / MCP Server (Zero-dep) |
          | `agent-pilot-darwin-arm64` | macOS Apple Silicon (M1-M4) | Standalone Go CLI / MCP Server (Zero-dep) |
          | `agent-pilot-windows-amd64.exe` | Windows x86_64 | Standalone Go CLI / MCP Server (Zero-dep) |
          | `agent-pilot-windows-arm64.exe` | Windows ARM64 | Standalone Go CLI / MCP Server (Zero-dep) |
          | `checksums.txt` | All Files | Bảng mã băm SHA-256 xác minh tính toàn vẹn |

          ---

          ### 🚀 Hướng Dẫn Cài Đặt (Installation)

          #### 1. Cài Đặt Chrome Extension (Giao Diện & Cầu Nối Trình Duyệt)
          1. Tải tệp `agent-pilot-$VERSION.zip` bên dưới và giải nén ra một thư mục.
          2. Mở trình duyệt Chrome, truy cập: `chrome://extensions`.
          3. Bật công tắc **Developer mode** ở góc trên bên phải.
          4. Nhấp nút **Load unpacked** và chọn thư mục vừa giải nén.
          5. Ghim icon và nhấp chuột vào biểu tượng **Agent Pilot (📌)** trên thanh công cụ để mở Side Panel (hoặc phím tắt <kbd>Ctrl+Shift+P</kbd> / <kbd>Cmd+Shift+P</kbd>).

          #### 2. Cài Đặt Standalone Go CLI & MCP Server
          Tải binary tương ứng với hệ điều hành của bạn bên dưới:
          ```bash
          # Ví dụ trên Linux AMD64:
          curl -LO https://github.com/ducconit/agent-pilot-extension/releases/download/$VERSION/agent-pilot-linux-amd64
          chmod +x agent-pilot-linux-amd64
          sudo mv agent-pilot-linux-amd64 /usr/local/bin/agent-pilot

          # Kiểm tra hoạt động:
          agent-pilot --help
          ```

          #### 3. Cài Đặt Kỹ Năng Cho Trợ Lý AI (Agent Skills)
          Mọi coding agent (Claude Code, Cursor, Antigravity, OpenCode, Codex, Devin,...) có thể cài đặt tự động kỹ năng chỉ với 1 lệnh:
          ```bash
          npx skills add https://github.com/ducconit/agent-pilot-extension
          ```

          ---

          ### 🤖 Cấu Hình MCP Server Cho AI Coding Assistant

          Thêm cấu hình sau vào tệp cấu hình MCP của bạn (`mcp_config.json`, Claude Desktop, hoặc Cursor Settings):

          ```json
          {
            "mcpServers": {
              "agent-pilot": {
                "command": "agent-pilot",
                "args": ["mcp"]
              }
            }
          }
          ```

          ---

          ### 🎮 Cẩm Nang Lệnh CLI Cho Tester / QC
          Kỹ sư kiểm thử tự động có thể điều khiển trình duyệt trực tiếp qua terminal mà không cần viết mã:
          ```bash
          agent-pilot open "https://github.com"
          agent-pilot click "#login-button"
          agent-pilot type "#username" "testuser" --enter
          agent-pilot screenshot -o page.png --mode visible
          agent-pilot inspect "#target-box"
          agent-pilot tabs
          agent-pilot batch flow.json
          agent-pilot feedback list
          ```

          ---

          ### ✨ Tính Năng Nổi Bật
          - **16 Công cụ MCP chuẩn hóa**: Mở tab, click chuột ảo neon, gõ phím human-like, soi DOM, chụp ảnh màn hình, kiểm tra DevTools (Console/Network/RAM).
          - **Động cơ Batch Engine (`browser_run_actions`)**: Gom chuỗi kịch bản đa bước thực thi trong 1 tool call duy nhất, tiết kiệm >80% token.
          - **Visual UI Feedback Studio**: Khoanh vùng ghim lỗi trực quan trên trang web, hỗ trợ 3 kênh giao tiếp (Live Push A, Persistent Inbox B, Clipboard Prompt C).
          - **Bảo mật Secret Redaction**: Tự động nhận diện và che giấu 12 mẫu khóa bí mật (API Key, Private Key, JWT, Bearer tokens).
          BODY_EOF
          sed -i "s/\$VERSION/$VERSION/g" dist/release_body.md

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent-pilot-*
            dist/checksums.txt
          name: "Agent Pilot ${{ github.ref_name }}"
          body_path: dist/release_body.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
