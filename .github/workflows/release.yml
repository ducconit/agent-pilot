name: Release Agent Pilot (Extension & CLI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v1.0.8-beta). Required for manual runs.'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Platform CLI & Extension Release
    runs-on: ubuntu-latest

    steps:
      # Resolve the tag first so every later step (checkout, version gate,
      # release creation) works for both tag pushes and manual dispatches.
      - name: Resolve Release Tag
        id: rel
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag_name }}"
            if [[ -z "$TAG" ]]; then
              echo "❌ workflow_dispatch requires the 'tag_name' input." >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Single source of truth: the toolchain required by go.mod
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Syntax & Lint Checks
        run: npm run lint

      - name: Run Browserless Unit Tests
        run: npm run test:secret && npm run test:item-schema && npm run test:color-utils && npm run test:background-api

      - name: Run Go Unit Tests (Race Detector)
        run: npm run test:cli

      # Block the release when the tag, package.json and manifest.json disagree.
      - name: Validate Version Alignment
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const tag = process.env.RELEASE_TAG;
          const pkg = require("./package.json");
          const manifest = require("./extensions/manifest.json");
          const manifestVer = manifest.version_name || manifest.version;
          console.log(`GitHub Tag     : ${tag}`);
          console.log(`package.json   : v${pkg.version}`);
          console.log(`manifest.json  : v${manifestVer}`);
          if (tag !== `v${pkg.version}` || tag !== `v${manifestVer}`) {
            console.error("❌ Release blocked: tag, package.json and manifest.json versions must match.");
            process.exit(1);
          }
          NODE

      - name: Package Chrome Extension Archive
        run: npm run pack

      - name: Package Per-Platform Release Bundles (extension + CLI + skills + README)
        run: npm run pack:bundle

      - name: Generate Release Body with User & Installation Guides
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          VERSION="$RELEASE_TAG"
          cat << 'BODY_EOF' > dist/release_body.md
          # 🚀 Agent Pilot $VERSION

          **Universal AI Agent Browser Controller • Antigravity-First**
          *Gói phát hành tổng hợp: Chrome Extension + Standalone Golang CLI / MCP Server + Agent Skill*

          ---

          ### 📦 Tài Nguyên Bản Phát Hành Theo 3 Hệ Điều Hành (Release Assets)

          | Bản Hệ Điều Hành | Tài Nguyên | Kiến Trúc | Nội Dung Trong Gói |
          | :--- | :--- | :--- | :--- |
          | 🐧 **Ubuntu / Linux** | `agent-pilot-$VERSION-linux-amd64.zip` | Linux x86_64 | `extensions/` + `agent-pilot` + `install.sh` + `README.md` (Ubuntu) + `skills/` |
          | 🐧 **Ubuntu / Linux** | `agent-pilot-$VERSION-linux-arm64.zip` | Linux ARM64 | `extensions/` + `agent-pilot` + `install.sh` + `README.md` (Ubuntu) + `skills/` |
          | 🍎 **macOS** | `agent-pilot-$VERSION-darwin-arm64.zip` | Apple Silicon (M1-M4) | `extensions/` + `agent-pilot` + `install.sh` (tự gỡ Gatekeeper) + `README.md` (macOS) + `skills/` |
          | 🍎 **macOS** | `agent-pilot-$VERSION-darwin-amd64.zip` | macOS Intel | `extensions/` + `agent-pilot` + `install.sh` (tự gỡ Gatekeeper) + `README.md` (macOS) + `skills/` |
          | 🪟 **Windows** | `agent-pilot-$VERSION-windows-amd64.zip` | Windows x86_64 | `extensions/` + `agent-pilot.exe` + `install.ps1` + `README.md` (Windows) + `skills/` |
          | 🪟 **Windows** | `agent-pilot-$VERSION-windows-arm64.zip` | Windows ARM64 | `extensions/` + `agent-pilot.exe` + `install.ps1` + `README.md` (Windows) + `skills/` |
          | 🌐 **Mọi nền tảng** | `agent-pilot-$VERSION.zip` | All | Chỉ Chrome Extension (dùng cho Chrome Web Store) |
          | 🔐 **Checksums** | `bundles/checksums.txt` | All | SHA-256 để xác minh tính toàn vẹn |

          Mỗi gói bundle đã được tối ưu riêng cho từng hệ điều hành:

          ```
          agent-pilot-$VERSION-<platform>/
          ├── extensions/            Chrome Extension (Manifest V3) — nạp trực tiếp vào Chrome
          ├── agent-pilot(|.exe)     Standalone CLI / MCP Server (binary tĩnh, zero-dep)
          ├── install.sh / .ps1      Script cài đặt 1 lệnh theo đúng hệ điều hành
          ├── skills/agent-pilot/    Agent Skill (SKILL.md + references + examples)
          └── README.md              Hướng dẫn cài đặt & cấu hình MCP chuyên biệt cho OS đó
          ```

          ---

          ### 🚀 Hướng Dẫn Cài Đặt Nhanh (từ bundle)

          **1. Chrome Extension**
          1. Giải nén gói bundle của hệ điều hành bạn đang dùng.
          2. Mở `chrome://extensions` → bật **Developer mode** → **Load unpacked** → chọn thư mục `extensions/`.
          3. Ghim icon **Agent Pilot (📌)**; mở Side Panel bằng click icon hoặc <kbd>Ctrl+Shift+P</kbd> / <kbd>Cmd+Shift+P</kbd>.

          **2. CLI / MCP Server & Dịch Vụ Chạy Ngầm (1 Lệnh)**
          ```bash
          # 🐧 Ubuntu / Linux & 🍎 macOS (tự gỡ Gatekeeper xattr, cài vào ~/.local/bin, kích hoạt systemd/launchd):
          chmod +x ./install.sh && ./install.sh
          ```
          ```powershell
          # 🪟 Windows PowerShell (tự gỡ SmartScreen, cài vào %LOCALAPPDATA%\Programs\agent-pilot, thêm PATH & Task Scheduler):
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          ```

          **3. Agent Skill (tùy chọn)**
          ```bash
          agent-pilot skill install          # ~/.agents/skills/agent-pilot
          agent-pilot skill install --agy    # ~/.gemini/config/skills/agent-pilot
          ```

          ---

          ### 🤖 Cấu Hình MCP Server Cho AI Coding Assistant

          Thêm vào file cấu hình MCP của agent (Antigravity `~/.gemini/config/mcp_config.json`,
          Claude Desktop, Cursor, Codex, OpenCode…):

          ```json
          {
            "mcpServers": {
              "agent-pilot": { "command": "agent-pilot", "args": ["mcp"] }
            }
          }
          ```

          ---

          ### 🎮 Cẩm Nang Lệnh CLI Cho Tester / QC
          ```bash
          agent-pilot open "https://github.com" --active
          agent-pilot click "#login-button"
          agent-pilot type "#username" "testuser" --enter
          agent-pilot screenshot -o page.png --mode visible
          agent-pilot inspect "#target-box"
          agent-pilot tabs
          agent-pilot batch flow.json
          agent-pilot feedback list
          ```

          ---

          ### ✨ Tính Năng Nổi Bật
          - **35 công cụ MCP chuẩn hóa**: quản lý tab, click chuột ảo neon, gõ phím human-like, soi DOM,
            chụp ảnh màn hình, batch actions, đọc DevTools (Console/Network/Performance) qua CDP.
          - **Động cơ Batch Engine (`browser_run_actions`)**: gom chuỗi kịch bản đa bước trong 1 tool call,
            tiết kiệm >80% token.
          - **Visual UI Feedback Studio**: khoanh vùng ghim lỗi trực quan, 3 kênh giao tiếp
            (Live Push A, Persistent Inbox B, Clipboard Prompt C).
          - **Bảo mật Secret Redaction**: tự động che 12 nhóm khóa bí mật (API Key, Private Key, JWT,
            Bearer token, header Authorization/Cookie…) trước khi gửi cho LLM.
          - **Bridge cục bộ an toàn**: chỉ lắng nghe `127.0.0.1:58765` (đổi bằng `AGENT_PILOT_PORT`).
          BODY_EOF
          sed -i "s/\$VERSION/$VERSION/g" dist/release_body.md
          cat dist/bundles/checksums.txt >> dist/checksums.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "Agent Pilot ${{ steps.rel.outputs.tag }}"
          files: |
            dist/bundles/agent-pilot-*.zip
            dist/agent-pilot-*.zip
            dist/checksums.txt
          body_path: dist/release_body.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.rel.outputs.tag, '-alpha') || contains(steps.rel.outputs.tag, '-beta') || contains(steps.rel.outputs.tag, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
