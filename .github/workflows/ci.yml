name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-package:
    name: Lint, Test & Package Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Syntax & Lint Checks
        run: npm run lint

      - name: Run Browserless Unit Tests (Sanitizer, Item Schema, Color Utils, Background API)
        run: npm run test:secret && npm run test:item-schema && npm run test:color-utils && npm run test:background-api

      - name: Run Go Unit Tests (Race Detector)
        run: npm run test:cli

      - name: Test Go CLI Build (Static Binary)
        run: |
          npm run build:cli
          ./cli/agent-pilot --help

      - name: Test Extension Packaging
        run: npm run pack
